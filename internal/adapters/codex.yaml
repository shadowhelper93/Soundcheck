id: codex
name: "OpenAI Codex"
vendor: OpenAI
binary: codex
category: platform
versionSupported: ">=0.9.0"
installed: false
authMethodSupported:
  - "OAuth login"
  - "CODEX_API_KEY"
  - "OPENAI_API_KEY"
headlessCommand: "codex exec --json --sandbox workspace-write"
permissionModes:
  - "--sandbox read-only"
  - "--sandbox workspace-write"
allowedFails: 2
consecutiveFails: 0
quirks:
  - id: codex-doctor-exit0
    agentId: codex
    name: "Codex Doctor Reports False Exit 0"
    docIssue: "Issue #54831 (openai/codex)"
    category: false_exit_code
    description: "codex doctor --json outputs a failed report with redacted token details but exits with code 0."
    referenceUrl: "https://github.com/openai/codex/issues/54831"
    discoveredDate: "2026-04-11"
    severity: critical
    impact: "False green status in CI runners followed by hard crash"
    resolution: "Parse JSON doctor report; reject if status is FAILED"
    triggerExitCode: 0
    triggerRegex: "(?i)(\"doctor_status\":\\s*\"FAILED\"|invalid_credentials|token.*expired)"
    errorClass: unauthenticated
    rewrittenExitCode: 401
    cooldownMinutes: 15
    caughtLie: true
  - id: codex-issue-10233
    agentId: codex
    name: "No Headless Quota Inspection API"
    docIssue: "Issue #10233: OpenAI exposes no non-interactive quota command."
    category: protocol_mismatch
    description: "Quota state can only be inferred reactively from HTTP 429 errors."
    referenceUrl: "https://github.com/openai/codex/issues/10233"
    discoveredDate: "2026-03-02"
    severity: high
    impact: "Cannot pre-check usage balance before expensive runs"
    resolution: "Implement LiteLLM cooldown tracker (allowed_fails + cooldown_time)"
    triggerExitCode: 1
    triggerRegex: "(?i)(insufficient_quota|quota_exceeded|429)"
    errorClass: quota_exhausted
    cooldownMinutes: 30
    caughtLie: false
modelsCommand: "codex debug models"
models:
  - id: gpt-4o
    displayName: "OpenAI GPT-4o"
    vendor: OpenAI
    tier: frontier
    contextWindow: 128000
    inputCostPerM: 2.5
    outputCostPerM: 10.0
    verified: true
  - id: gpt-4o-mini
    displayName: "OpenAI GPT-4o Mini"
    vendor: OpenAI
    tier: fast
    contextWindow: 128000
    inputCostPerM: 0.15
    outputCostPerM: 0.6
    verified: true
  - id: o3-mini
    displayName: "OpenAI o3-mini (Reasoning)"
    vendor: OpenAI
    tier: reasoning
    contextWindow: 200000
    inputCostPerM: 1.1
    outputCostPerM: 4.4
    verified: true
probeSpecs:
  L0:
    level: L0
    command: "codex --version"
    timeoutMs: 3000
    expectedExitCode: 0
  L1:
    level: L1
    command: "codex features list"
    timeoutMs: 5000
    expectedExitCode: 0
  L2:
    level: L2
    command: "codex features list"
    timeoutMs: 5000
    expectedExitCode: 0
  L3:
    level: L3
    command: "codex exec --json \"print('model check')\""
    timeoutMs: 90000
    expectedExitCode: 0
