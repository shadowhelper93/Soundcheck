probeSpecs:
  L0:
    level: L0
    command: "claude --version"
    timeoutMs: 3000
    expectedExitCode: 0
  L1:
    level: L1
    command: "claude auth status"
    timeoutMs: 4000
    expectedExitCode: 0
  L2:
    level: L2
    command: "claude -p \"reply with JSON {\\\"ok\\\":true}\" --output-format json"
    timeoutMs: 45000
    expectedExitCode: 0
  L3:
    level: L3
    command: "claude -p \"ping\" --output-format json"
    timeoutMs: 90000
    expectedExitCode: 0
