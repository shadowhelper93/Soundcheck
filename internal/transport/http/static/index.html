<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundcheck — Multi-CLI Deterministic Prober</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0D12;
            --surface: #121721;
            --border: #1E2638;
            --text: #E6EAF2;
            --muted: #8B95A7;
            --ok: #10B981;
            --cooldown: #F59E0B;
            --false0: #EF4444;
            --cyan: #06B6D4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Code', monospace; font-feature-settings: "calt" 1, "liga" 1; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--surface); }
        .logo { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.25rem; color: var(--cyan); }
        nav { display: flex; gap: 1rem; }
        .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .tab-btn.active, .tab-btn:hover { border-color: var(--cyan); color: var(--text); background: rgba(6, 182, 212, 0.05); }
        main { flex: 1; padding: 2rem; max-width: 1400px; width: 100%; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        h2 { font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--text); font-weight: 600; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
        .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge.ok { background: rgba(16, 185, 129, 0.1); color: var(--ok); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge.cooldown { background: rgba(245, 158, 11, 0.1); color: var(--cooldown); border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge.error { background: rgba(239, 68, 68, 0.1); color: var(--false0); border: 1px solid rgba(239, 68, 68, 0.2); }
        button.primary { background: var(--cyan); color: var(--bg); border: none; padding: 0.75rem 1.5rem; font-weight: 700; border-radius: 4px; cursor: pointer; transition: opacity 0.2s; }
        button.primary:hover { opacity: 0.9; }
        pre { background: var(--bg); border: 1px solid var(--border); padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.85rem; color: var(--muted); }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
            SOUNDCHECK
        </div>
        <nav>
            <button class="tab-btn active" onclick="switchTab('doctor')">Doctor</button>
            <button class="tab-btn" onclick="switchTab('resolve')">Role Resolver</button>
            <button class="tab-btn" onclick="switchTab('manifest')">Manifest</button>
        </nav>
    </header>
    <main>
        <div id="tab-doctor" class="tab-content active">
            <h2>Environment Health Doctor</h2>
            <div style="margin-bottom: 1rem;">
                <button class="primary" onclick="runDoctor()">Run Full Doctor Check</button>
            </div>
            <div id="doctor-results" class="card">
                <pre>Click "Run Full Doctor Check" to inspect adapters...</pre>
            </div>
        </div>
        <div id="tab-resolve" class="tab-content">
            <h2>Deterministic Role Resolution</h2>
            <div style="margin-bottom: 1rem;">
                <button class="primary" onclick="runResolve()">Resolve Roles</button>
            </div>
            <div id="resolve-results" class="card">
                <pre>Click "Resolve Roles" to evaluate agent hierarchy...</pre>
            </div>
        </div>
        <div id="tab-manifest" class="tab-content">
            <h2>System Manifest</h2>
            <div style="margin-bottom: 1rem;">
                <button class="primary" onclick="loadManifest()">Fetch Manifest</button>
            </div>
            <div id="manifest-results" class="card">
                <pre>Click "Fetch Manifest" to inspect host & environment info...</pre>
            </div>
        </div>
    </main>
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function runDoctor() {
            const el = document.getElementById('doctor-results');
            el.innerHTML = '<pre>Running probes across L0-L3...</pre>';
            try {
                const res = await fetch('/api/doctor?deep=true');
                const data = await res.json();
                el.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (err) {
                el.innerHTML = '<pre style="color:var(--false0)">Error: ' + err.message + '</pre>';
            }
        }

        async function runResolve() {
            const el = document.getElementById('resolve-results');
            el.innerHTML = '<pre>Resolving roles...</pre>';
            try {
                const res = await fetch('/api/resolve');
                const data = await res.json();
                el.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (err) {
                el.innerHTML = '<pre style="color:var(--false0)">Error: ' + err.message + '</pre>';
            }
        }

        async function loadManifest() {
            const el = document.getElementById('manifest-results');
            el.innerHTML = '<pre>Loading manifest...</pre>';
            try {
                const res = await fetch('/api/manifest');
                const data = await res.json();
                el.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (err) {
                el.innerHTML = '<pre style="color:var(--false0)">Error: ' + err.message + '</pre>';
            }
        }
    </script>
</body>
</html>
