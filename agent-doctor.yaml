# Soundcheck Canonical Configuration (agent-doctor.yaml)
# Validated against JSON Schema 2026.1
version: 1

roles:
  primary:
    - "claude:claude-sonnet-5-5"
    - "claude:claude-opus-5-5"
    - "codex:*"
    - "opencode:anthropic/claude-sonnet-5-5"
    - "agy:gemini-2.5-pro"
  subagent:
    - "claude:claude-sonnet-5-5"
    - "codex:*"
    - "opencode:*"
    - "agy:gemini-2.5-flash"
  auxiliary:
    - "claude:claude-haiku-5-5"
    - "codex:*"
    - "agy:gemini-2.5-flash"
  reviewer:
    - "codex:*"
    - "agy:*"
    - "opencode:*"
    - "copilot:*"
    - "claude:*"

policy:
  require_distinct_vendor: [primary, reviewer]
  max_cost_usd_per_run: 5.0
  probe:
    deep: false
    ttl_minutes: 30
