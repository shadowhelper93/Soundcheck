# Soundcheck Canonical Configuration (agent-doctor.yaml)
# Validated against JSON Schema 2026.1
version: 1

roles:
  primary:
    - "claude:claude-3-7-sonnet"
    - "claude:claude-3-5-sonnet"
    - "codex:gpt-4o"
    - "codex:gpt-4o"
    - "opencode:anthropic/claude-sonnet"
    - "agy:gemini-1.5-pro"
    - "agy:gemini-2.5-pro"
  subagent:
    - "claude:claude-3-7-sonnet"
    - "claude:claude-3-5-sonnet"
    - "codex:gpt-4o-mini"
    - "opencode:*"
    - "agy:gemini-2.0-flash"
    - "agy:gemini-2.5-flash"
  auxiliary:
    - "claude:claude-3-5-haiku"
    - "codex:gpt-4o-mini"
    - "agy:gemini-2.0-flash"
    - "agy:gemini-2.5-flash"
    - "codex:gpt-4o-mini"
  reviewer:
    - "codex:gpt-4o"
    - "codex:*"
    - "agy:gemini-1.5-pro"
    - "agy:*"
    - "opencode:*"
    - "copilot:*"
    - "claude:*"

policy:
  require_distinct_vendor: [primary, reviewer]
  max_cost_usd_per_run: 5.0
  probe:
    deep: false
    ttl_minutes: 30
