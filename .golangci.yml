version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - gosec
    - gocyclo
    - funlen
    - gocritic
    - revive
    - forbidigo

linters-settings:
  funlen:
    lines: 30
    statements: 30
  gocyclo:
    min-complexity: 10
  forbidigo:
    forbid:
      - p: '^fmt\.Print.*$'
        msg: "fmt.Print* is forbidden in internal/core; core must perform zero direct IO"
    analyze-types: true

issues:
  exclude-rules:
    - path-except: 'internal/core/'
      linters:
        - forbidigo
    - path: '_test\.go'
      linters:
        - funlen
        - gocyclo
        - gosec
        - forbidigo
