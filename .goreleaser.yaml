version: 2

project_name: soundcheck

before:
  hooks:
    - npm --prefix ui run build

builds:
  - id: soundcheck
    main: ./cmd/soundcheck
    binary: soundcheck
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/soundcheck/soundcheck/internal/transport/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

sboms:
  - artifacts: archive

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: soundcheck
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/soundcheck/soundcheck"
    description: "Adaptive multi-CLI coding agent orchestrator with automatic failover"
    license: "Apache-2.0"
    test: |
      system "#{bin}/soundcheck", "version"

scoops:
  - repository:
      owner: soundcheck
      name: scoop-bucket
    homepage: "https://github.com/soundcheck/soundcheck"
    description: "Adaptive multi-CLI coding agent orchestrator with automatic failover"
    license: "Apache-2.0"
