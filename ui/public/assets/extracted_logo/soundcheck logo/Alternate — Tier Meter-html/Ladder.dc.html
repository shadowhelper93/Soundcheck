<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soundcheck alternate logo</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8B95A7}a:hover{color:#E6EAF2}
</style>
</helmet>
<div style="width: 1200px; height: 720px; box-sizing: border-box; background: #0A0D12; color: #E6EAF2; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 72px">
<div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #8B95A7; letter-spacing: 0.08em; text-transform: uppercase">
<span>Soundcheck / Alternate</span>
<span>Mark: Tier Meter</span>
</div>
<div style="display: flex; align-items: center; gap: 64px">
<div style="display: flex; flex-direction: column; gap: 14px; align-items: center">
<svg width="240" height="240" viewBox="0 0 64 64" role="img" aria-label="Four rising level-meter bars, the tallest topped with a check">
<rect x="6" y="44" width="9" height="14" rx="2" fill="#4A5468"></rect>
<rect x="20" y="34" width="9" height="24" rx="2" fill="#8B95A7"></rect>
<rect x="34" y="24" width="9" height="34" rx="2" fill="#E6EAF2"></rect>
<rect x="48" y="22" width="9" height="36" rx="2" fill="{{accent}}"></rect>
<polyline points="42,11 48,16 60,4" fill="none" stroke="{{accent}}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>
</svg>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 200px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #8B95A7">
<span>L0</span><span>L1</span><span>L2</span><span style="color: {{accent}}">L3</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 96px; letter-spacing: -0.04em; line-height: 1">Soundcheck</div>
<div style="font-size: 22px; color: #8B95A7; line-height: 1.45">Presence → Auth → Smoke → Model.<br>Every tier lit before a single token burns.</div>
</div>
</div>
<div style="border-top: 1px solid #1E2638; padding-top: 24px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #8B95A7">A mixing-desk level meter where each bar is one probe tier — the check only lands once L3 passes.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#10B981","options":["#10B981","#06B6D4","#F59E0B"]},"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#10B981' };
}
}
</script>
</body>
</html>
